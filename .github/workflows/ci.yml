# Checks every push and pull request: the Svelte/TypeScript check, the frontend build, the Rust
# tests and clippy (clippy warnings are shown but don't fail the run yet).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm packages
        run: npm ci

      - name: Svelte / TypeScript check
        run: npm run check

      # The Rust crate embeds the built frontend, so it has to exist before cargo runs.
      - name: Build the frontend
        run: npm run build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --lib
